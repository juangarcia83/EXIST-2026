[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exist2026"
version = "0.1.0"
description = "ELiRF-UPV at EXIST 2026: multimodal fusion and few-shot LLMs for sexism detection in memes and videos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
authors = [
    { name = "Juan Alfonso García-Real", email = "jagarrea@etsinf.upv.es" },
    { name = "Vicent Ahuir", email = "vahuir@upv.es" },
    { name = "María José Castro-Bleda", email = "mcastro@dsic.upv.es" },
]
keywords = ["EXIST", "CLEF", "sexism detection", "multimodal", "learning with disagreements"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core is deliberately light: configs, labels, pools, prompts, parsing and
# the submission format need nothing but numpy/pandas/PyYAML, so they import
# and test on any machine. Everything heavy lives behind an extra.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# System B: prompting a vision-language model.
fewshot = [
    "torch>=2.2",
    "transformers>=4.57",
    "accelerate>=0.30",
    "pillow>=10.0",
    "qwen-vl-utils",
]
# System A: training the cross-attention fusion model.
fusion = [
    "torch>=2.2",
    "transformers>=4.57",
    "optuna>=3.6",
    "matplotlib>=3.8",
]
# Official scoring.
eval = ["PyEvALL"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "nbstripout>=0.7",
    "pre-commit>=3.7",
]
all = ["exist2026[fewshot,fusion,eval,dev]"]

[project.scripts]
exist2026-fewshot = "exist2026.cli:fewshot_main"
exist2026-fusion = "exist2026.cli:fusion_main"

[project.urls]
Homepage = "https://github.com/juangarcia83/EXIST-2026"
"Shared task" = "http://nlp.uned.es/exist2026/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exist2026 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI-style default calls; not relevant here
    "RUF001",  # the prompts and docstrings are intentionally bilingual
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]     # conftest imports after the path setup
"scripts/*" = ["E402"]   # sys.path bootstrap before the package imports

[tool.ruff.lint.isort]
known-first-party = ["exist2026"]

[tool.black]
line-length = 110
target-version = ["py310"]
